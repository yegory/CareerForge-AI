[package]
name = "careerforge_ai"
version = "0.1.0"
description = "CareerForge AI desktop shell"
authors = ["CareerForge AI"]
license = "MIT"
repository = "https://github.com/yegory/CareerForge-AI"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "careerforge_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0" }
tauri-plugin-log = "2"
